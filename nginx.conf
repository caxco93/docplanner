server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything in /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML references the current hashed assets, so it must be revalidated
    # on every request (Bunny honours this and revalidates against the origin).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
